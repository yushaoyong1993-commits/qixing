name: Flutter compatibility matrix

# 目的：探明当前代码在不同 Flutter SDK 上的兼容性，为"升级 SDK → 解除依赖固定 → 上 AGP9/Gradle9"提供依据。
# 触发：手动 + 每周一自动跑一次（不参与 push 主流水线，省额度）。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # UTC 02:00 周一（北京时间 10:00）

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  # ① 锁定版本（与本地/主流水线一致）：必须通过
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: 环境信息
        run: flutter --version
      - name: 依赖
        working-directory: app
        run: flutter pub get
      - name: 静态分析
        working-directory: app
        run: flutter analyze
      - name: 全量测试
        working-directory: app
        run: flutter test

  # ② 最新 stable（实验性，失败不阻塞）：探明能否升级 SDK / 解除依赖固定
  #    注意：subosito/flutter-action 取最新 stable 时只给 channel，不给 flutter-version
  latest-stable:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 环境信息
        run: flutter --version
      - name: 依赖
        working-directory: app
        run: flutter pub get
      - name: 静态分析
        working-directory: app
        run: flutter analyze
      - name: 全量测试
        working-directory: app
        run: flutter test

      # 实验：临时移除 dependency_overrides，看新 SDK 下 objective_c 钩子能否编译
      - name: 实验｜尝试解除 path_provider_foundation 固定
        continue-on-error: true
        working-directory: app
        run: |
          python3 - <<'PYEOF'
          p = 'pubspec.yaml'
          s = open(p).read()
          s = s.split('# —— 构建兼容性修复 ——')[0].rstrip() + '\n'
          open(p, 'w').write(s)
          print('已临时移除 dependency_overrides')
          PYEOF
          flutter pub get
          flutter build bundle --target-platform android-arm64
          echo "::notice title=解除固定可行::最新 stable 上 objective_c 钩子编译通过，可删除 dependency_overrides"
