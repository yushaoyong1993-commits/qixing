name: Android CI

# 触发方式：
#   1) 网页手动点按钮（推荐日常用，省额度）：Actions → Android CI → Run workflow
#   2) 推送到 main（会自动跑质量门 + 出包）
#   3) 打 tag（v*）同样触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 只用免费额度内的 Linux Runner（1x 计费）
env:
  FLUTTER_VERSION: '3.47.2'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  # 与本地 android/gradle.properties 一致：8GB 级机器也能编，云端更快
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'

jobs:
  # ---------- 质量门：静态分析 + 全量测试（很快，约 1~2 分钟） ----------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析
        working-directory: app
        run: flutter analyze

      - name: 单元/系统测试
        working-directory: app
        run: flutter test

  # ---------- 出包：release APK（arm64 单架构，体积小） ----------
  apk:
    needs: quality
    runs-on: ubuntu-latest
    env:
      # 以下 Secrets 未配置时为空 → Gradle 自动回退 debug 签名（构建不会失败）
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 补齐 Android SDK 组件（compileSdk 36 + NDK，插件原生库需要）
      - name: 安装 Android SDK 组件
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1 || true

      - name: 配置正式签名（若已设置 Secrets）
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/basho-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/basho-release.jks" >> "$GITHUB_ENV"
          echo "::notice title=签名::已启用正式签名（release keystore）"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 构建 release APK（arm64）
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: basho-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7      # 只保留 7 天，避免占用私有仓库的存储额度
          if-no-files-found: error
