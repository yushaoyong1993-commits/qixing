name: Android CI

# 触发方式：
#   1) 网页手动点按钮（推荐日常用，省额度）：Actions → Android CI → Run workflow
#   2) 推送到 main（会自动跑质量门 + 出包）
#   3) 打 tag（v*）同样触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 发布 Release 需要 contents: write
permissions:
  contents: write

# 只用免费额度内的 Linux Runner（1x 计费）
env:
  FLUTTER_VERSION: '3.47.4'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  # 与本地 android/gradle.properties 一致：8GB 级机器也能编，云端更快
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'

jobs:
  # ---------- 质量门：静态分析 + 全量测试（很快，约 1~2 分钟） ----------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析
        working-directory: app
        run: flutter analyze

      - name: 单元/系统测试
        working-directory: app
        run: flutter test

  # ---------- 出包：release APK（arm64 单架构，体积小） ----------
  apk:
    needs: quality
    runs-on: ubuntu-latest
    env:
      # 以下 Secrets 未配置时为空 → Gradle 自动回退 debug 签名（构建不会失败）
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 补齐 Android SDK 组件（compileSdk 36 + NDK，插件原生库需要）
      - name: 安装 Android SDK 组件
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1 || true

      - name: 配置正式签名（若已设置 Secrets）
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/basho-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/basho-release.jks" >> "$GITHUB_ENV"
          echo "::notice title=签名::已启用正式签名（release keystore）"

      - name: 校验签名配置（提前发现 Secrets 填错）
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          SIZE=$(stat -c%s "$KEYSTORE_PATH")
          B64LEN=${#KEYSTORE_BASE64}
          SPLEN=${#KEYSTORE_PASSWORD}
          KPLEN=${#KEY_PASSWORD}
          ALEN=${#KEY_ALIAS}
          echo "诊断 keystore=$SIZE 字节(期望 2710) base64=$B64LEN(期望 3616) storePwd=$SPLEN(期望 24) keyPwd=$KPLEN(期望 24) alias=$ALEN(期望 5)"

          ok=1
          [ "$SIZE" = "2710" ] || { echo "::error title=KEYSTORE_BASE64 有误::解码后 $SIZE 字节，期望 2710。base64 可能被截断或含多余换行。"; ok=0; }
          [ "$SPLEN" = "24" ] || { echo "::error title=KEYSTORE_PASSWORD 有误::长度 $SPLEN，期望 24。"; ok=0; }
          [ "$KPLEN" = "24" ] || { echo "::error title=KEY_PASSWORD 有误::长度 $KPLEN，期望 24（与 KEYSTORE_PASSWORD 相同）。"; ok=0; }
          [ "$ALEN" = "5" ] || { echo "::error title=KEY_ALIAS 有误::长度 $ALEN，期望 5（应为 basho）。"; ok=0; }

          if keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
               -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" > /tmp/kt.txt 2>&1; then
            echo "✅ keystore 口令与别名校验通过"
            grep -iE "SHA1|SHA-1" /tmp/kt.txt | head -2 || true
          else
            echo "::error title=签名校验失败::keytool 校验不通过，请核对 Secrets（口令/别名）"
            tail -3 /tmp/kt.txt
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 构建 release APK（arm64）
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: 校验签名指纹（确认是否用了正式签名）
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ls -lh "$APK"
          if [ -x "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | grep -i "SHA-1" | head -3 || true
          fi
          echo "参考：正式签名 SHA-1 = 88:35:81:28:73:BE:15:53:7A:D8:D1:B2:D5:29:1F:D9:AE:DF:BF:5A"
          echo "若上面打印的 SHA-1 不是这串，说明本次未启用正式签名（未配置 Secrets），此时真机地图会因签名不匹配而无法加载。"

      - name: 打 tag 时发布 Release（手机可直接下载安装）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/app/outputs/flutter-apk/app-release.apk#basho-$GITHUB_REF_NAME-arm64.apk" \
            --title "跋涉 $GITHUB_REF_NAME" \
            --notes "CI 自动构建的 arm64 release 包。\n\n安装前请确认 APK 签名 SHA-1 与高德后台绑定的指纹一致（见构建日志的「校验签名指纹」步骤）。" \
            --latest

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: basho-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7      # 只保留 7 天，避免占用私有仓库的存储额度
          if-no-files-found: error
