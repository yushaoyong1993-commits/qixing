# JVM 参数：本机内存约 8GB，构建必须保守（曾因 8G 堆导致 OOM，终端与 DSH 一起被杀）
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin 编译进程单独限内存
kotlin.daemon.jvmargs=-Xmx768m
# 降低并行度，避免多进程同时占用内存
org.gradle.workers.max=1
org.gradle.parallel=false
# 不用常驻 daemon（构建结束即释放内存；代价是下次构建稍慢）
org.gradle.daemon=false

android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false

# R8 完整模式：CI/Linux 构建开启（更小更快的包）；本地内存紧张时可临时改 false
android.enableR8.fullMode=true
